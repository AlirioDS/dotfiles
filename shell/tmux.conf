##### Terminal & colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:Tc'   # truecolor

##### Basics
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
setw -g mode-keys vi

##### Status (minimal)
set -g status on
set -g status-interval 5
set -g status-left "[#S] "
setw -g automatic-rename on
setw -g automatic-rename-format "#{window_index}:#{pane_current_command}"

##### Mouse: scroll inside panes
set -g mouse on
bind -n WheelUpPane   if-shell -F "#{pane_in_mode}" "send-keys -X scroll-up"   "copy-mode -e"
bind -n WheelDownPane if-shell -F "#{pane_in_mode}" "send-keys -X scroll-down" "send-keys -X cancel"
bind -T copy-mode-vi WheelUpPane   send-keys -X scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X scroll-down

##### Optional: quick toggle (Ctrl-b m) between tmux mouse ON/OFF
bind m if -F '#{mouse}' \
  'set -g mouse off \; display "tmux mouse: OFF (terminal scroll)"' \
  'set -g mouse on  \; display "tmux mouse: ON (pane scroll)"'
